<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ETI Bingo QR Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/brand.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  @page { size: letter; margin: 0; }
  body { background: #e9edf3; }
  .bar { padding: 14px 20px; font-size: 14px; color: var(--muted); }
  .bar button { background: var(--navy); color: #fff; padding: 8px 14px; border-radius: 8px; font-weight: 700; margin-left: 8px; }
  .page { width: 8.5in; height: 11in; background: #fff; margin: 0 auto 20px; display: grid; grid-template-rows: 1fr 1fr; }
  .card { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: .35in; padding: .45in .6in; border-bottom: 1px dashed #b8c2d3; }
  .card:last-child { border-bottom: 0; }
  .brand { display: flex; align-items: center; gap: .14in; }
  .brand .mark { width: .55in; height: .55in; background: #fff; border: 2px solid var(--line); border-radius: .12in; padding: .05in; }
  .eyebrow { font-size: 10pt; letter-spacing: 2pt; text-transform: uppercase; color: var(--muted); }
  h1 { font-family: var(--display); font-weight: 800; font-size: 54pt; line-height: .9; color: var(--navy); margin-top: .18in; }
  h1 span { color: var(--amber); }
  .table { display: inline-block; margin-top: .18in; font-family: var(--display); font-weight: 800; font-size: 30pt; background: var(--amber); color: #3a2a00; border-radius: .1in; padding: .03in .2in; }
  .how { margin-top: .2in; font-size: 12.5pt; color: var(--ink); line-height: 1.4; max-width: 3.6in; }
  .qr { width: 3in; height: 3in; padding: .12in; border: 4px solid var(--navy); border-radius: .18in; }
  .qr svg { width: 100%; height: 100%; display: block; }
  .url { text-align: center; font-size: 10pt; color: var(--muted); margin-top: .08in; }
  @media print { body { background: #fff; } .bar { display: none; } .page { margin: 0; break-after: page; } }
</style>
</head>
<body>
<div class="bar">Two QR cards per page; put one on each table. Fold or cut on the dashed line. <button onclick="print()">Print</button></div>
<div id="pages"></div>
<script type="module">
  import { LOGO, qrSvg } from './assets/common.js';
  const n = Math.max(1, Math.min(30, parseInt(new URLSearchParams(location.search).get('count'), 10) || 10));
  const joinUrl = new URL('./', location.href).href;
  const host = joinUrl.replace(/^https?:\/\//, '').replace(/\/$/, '');
  const cards = Array.from({ length: n }, (_, i) => {
    const url = joinUrl;
    return `<div class="card"><div>
      <div class="brand"><div class="mark">${LOGO}</div><div class="eyebrow">ETI Q4 Townhall</div></div>
      <h1>ETI <span>Bingo</span></h1>
      <p class="how">Scan to get your own card. When a square is called, tap it on your card. Complete the pattern and hit BINGO first to win.</p></div>
      <div><div class="qr">${qrSvg(url)}</div><div class="url">${host}</div></div></div>`;
  });
  let html = '';
  for (let i = 0; i < cards.length; i += 2) html += `<div class="page">${cards[i]}${cards[i + 1] || '<div class="card"></div>'}</div>`;
  document.getElementById('pages').innerHTML = html;
</script>
</body>
</html>
