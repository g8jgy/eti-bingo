<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ETI Bingo POC</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
  :root { --navy: #00358A; --deep: #001F52; --amber: #FFA000; --ink: #1d2433; --muted: #5d6b82; --line: #d9e0ec; --bg: #eef2f8; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { font-family: 'DM Sans', system-ui, sans-serif; background: var(--bg); color: var(--ink); display: grid; grid-template-rows: auto auto 1fr; overflow: hidden; }
  header { background: var(--navy); color: #fff; display: flex; align-items: center; gap: 18px; padding: 10px 18px; flex-wrap: wrap; }
  header h1 { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 26px; letter-spacing: .5px; line-height: 1; }
  header h1 span { color: var(--amber); }
  header .tag { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #c9d4e8; border: 1px solid rgba(255,255,255,.35); border-radius: 99px; padding: 3px 9px; }
  .ctl { margin-left: auto; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font-size: 13px; }
  .ctl label { display: flex; gap: 6px; align-items: center; color: #c9d4e8; }
  .ctl select, .ctl button { font: inherit; font-weight: 600; border-radius: 8px; border: 1px solid rgba(255,255,255,.4); background: rgba(255,255,255,.1); color: #fff; padding: 6px 10px; cursor: pointer; }
  .ctl select option { color: var(--ink); }

  main { display: flex; gap: 16px; padding: 14px 18px; min-height: 0; }
  .pane { display: flex; flex-direction: column; gap: 6px; min-height: 0; }
  .pane h2 { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); font-weight: 700; display: flex; gap: 8px; align-items: center; }
  .pane h2 button { font: inherit; font-size: 10px; letter-spacing: 1px; border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 2px 6px; cursor: pointer; color: var(--muted); }
  .hostpane { flex: 1; min-width: 0; }
  .hostbox { flex: 1; min-height: 0; display: grid; place-items: center; }
  #host { width: 100%; aspect-ratio: 16 / 9; max-height: 100%; border: 0; border-radius: 10px; background: #001F52; box-shadow: 0 8px 30px rgba(0,31,82,.25); }
  .phones { display: flex; gap: 14px; min-height: 0; flex: 1; max-height: 820px; }
  .phone { width: 360px; flex: 0 0 auto; border: 10px solid #111; border-radius: 34px; overflow: hidden; background: #fff; box-shadow: 0 8px 30px rgba(0,0,0,.2); }
  .phone iframe { width: 100%; height: 100%; border: 0; display: block; }
  @media (max-width: 1100px) { body { overflow: auto; } main { flex-direction: column; } .hostpane, .hostbox { flex: none; display: block; } .phones { flex: none; height: 760px; } #host { max-height: none; } }
</style>
</head>
<body>
<header>
  <h1>ETI <span>Bingo</span></h1>
  <span class="tag">Proof of concept &middot; runs offline</span>
  <div class="ctl">
    <label>Bots <select id="botCount"><option value="0">None</option><option value="10">10</option><option value="30" selected>30</option><option value="69">69</option></select></label>
    <label>Bot speed <select id="botSpeed"><option value="1.8">Slow</option><option value="1" selected>Normal</option><option value="0.5">Fast</option></select></label>

  </div>
</header>
<div class="steps">
  <span><b>1.</b> Join on the phone</span>
  <span><b>2.</b> Press <b>Draw</b> on the big screen (or D)</span>
  <span><b>3.</b> Tap squares that glow</span>
  <span><b>4.</b> Line complete? Hit <b>BINGO</b></span>
  <span class="bots" id="botStatus"></span>
</div>
<main>
  <section class="pane hostpane"><h2>Big screen (host laptop)</h2><div class="hostbox"><iframe id="host" title="Host screen"></iframe></div></section>
  <section class="pane"><h2>Phones <button id="dropPhone" hidden>Remove last</button></h2><div class="phones" id="phones"></div></section>
</main>

<script>
(() => {

const backend = 'memory';
const mem = { s: {}, h: {} };
async function exec(cmds) {
  const m = mem;
  return cmds.map(([cmd, ...a]) => {
    switch (cmd.toUpperCase()) {
      case 'GET': return m.s[a[0]] ?? null;
      case 'MGET': return a.map((k) => m.s[k] ?? null);
      case 'SET': {
        const nx = a.slice(2).map((x) => String(x).toUpperCase()).includes('NX');
        if (nx && a[0] in m.s) return null;
        m.s[a[0]] = String(a[1]); return 'OK';
      }
      case 'DEL': { let n = 0; for (const k of a) { if (k in m.s) { delete m.s[k]; n++; } if (k in m.h) { delete m.h[k]; n++; } } return n; }
      case 'HGET': return m.h[a[0]]?.[a[1]] ?? null;
      case 'HSET': { const h = (m.h[a[0]] ||= {}); for (let i = 1; i < a.length; i += 2) h[a[i]] = String(a[i + 1]); return 1; }
      case 'HDEL': { const h = m.h[a[0]] || {}; let n = 0; for (const f of a.slice(1)) if (f in h) { delete h[f]; n++; } return n; }
      case 'HGETALL': { const h = m.h[a[0]] || {}; return Object.entries(h).flat(); }
      case 'HLEN': return Object.keys(m.h[a[0]] || {}).length;
      default: throw new Error('memstore: unsupported ' + cmd);
    }
  });
}
function hashToObj(flat) {
  const o = {};
  for (let i = 0; i < (flat || []).length; i += 2) o[flat[i]] = flat[i + 1];
  return o;
}
const process = { env: {} };
const crypto = { randomBytes: (n) => ({ toString: () => {
  const b = window.crypto.getRandomValues(new Uint8Array(n));
  return btoa(String.fromCharCode(...b)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
} }) };

// ETI Bingo square pool: 36 squares, each card holds 24 of them (center is the free yETI square).
// Simulated with 70 players: first line ~draw 9, two lines ~draw 16, first full card ~draw 32.
//
// label   = name on the big screen when drawn
// tile    = text on the 5x5 card; soft hyphens (­) mark where long words may break
// caption = one line shown under the drawn square on the big screen
//
// Sources: the 2026 celebration video project cards, the 2027 Enterprise Portfolio & Delivery plan,
// and the GDI brand list (Sept 2026). Captions are DRAFT: review before Nov 18.

const SQUARES = [
  // Shipped in 2026
  { id: 'varonis', label: 'Varonis MDDR', caption: 'Managed data detection and response, enterprise-wide.' },
  { id: 'ninjaone', label: 'NinjaOne', caption: 'One standard for endpoint visibility, patching and remote support.' },
  { id: 'yeti', label: 'yETI', caption: 'A governed AI assistant grounded in GDI knowledge.' },
  { id: 'intranet', label: 'Enterprise Intranet', tile: 'Enter­prise Intranet', caption: 'One source for news, policy and self-service across every brand.' },
  { id: 'callcenter', label: 'Call Center Optimization', tile: 'Call Center Opti­mization', caption: 'Speed-to-lead, the Hatch SMS program and the 2027 CCaaS selection.' },
  { id: 'webcp', label: 'WebCP 3055', caption: 'Version 3055 plus new catalog products for Champion ordering.' },
  { id: 'etitools', label: 'ETI Tools', caption: 'Capacity Log, Budget App and Resource Hub, built in-house.' },
  { id: 'bc', label: 'Business Central', caption: 'One guided application over a single job record for Leafguard.' },
  { id: 'vendo', label: 'Vendo', caption: 'Visualization, contracts and financing on the iPad for Champion.' },
  { id: 'lighthouse', label: 'Lighthouse', tile: 'Light­house', caption: 'GDI analytics consolidated on Databricks, report by report.' },
  { id: 'leadhub', label: 'Lead Hub', caption: 'Dispositioning, rep assignment, consent and a cross-brand customer view.' },
  { id: 'folio', label: 'Folio 2.0', caption: 'Guided selling and CPQ for Leafguard, Sunrooms and the enterprise.' },
  { id: 'costco', label: 'Costco Program', caption: 'Centah integration, WinGen scheduling, the Costco relay and DocuSign.' },
  { id: 'magic', label: 'Sunsetting Magic', tile: 'Sunset­ting Magic', caption: 'The Windows 95-era Magic server, retired into WebCP.' },
  { id: 'lakehouse', label: 'Data Lakehouse', tile: 'Data Lake­house', caption: 'New sources ingested, conformed and published into the GDI lakehouse.' },
  { id: 'martech', label: 'Martech Platform', tile: 'Martech Plat­form', caption: 'The shared enterprise web platform, measurement and conversion tooling.' },
  { id: 'adobe', label: 'Adobe', caption: 'One enterprise Adobe tenant with SSO and provisioning.' },
  // In flight and 2027
  { id: 'salesforce', label: 'Salesforce', tile: 'Sales­force', caption: 'The enterprise CRM for lead intake and appointments, Leafguard first.' },
  { id: 'golive', label: 'Feb 1 Go-Live', caption: 'Salesforce and Folio 2.0 go live together for Leafguard on Feb 1, 2027.' },
  { id: 'five9', label: 'Five9', caption: 'One contact-center platform for every brand.' },
  { id: 'm365', label: 'Microsoft 365', tile: 'Micro­soft 365', caption: 'One tenant, one identity, MFA everywhere.' },
  { id: 'freshservice', label: 'Freshservice', tile: 'Fresh­service', caption: 'The Service Desk, rebuilt around ITIL best practice.' },
  { id: 'win11', label: 'Windows 11', caption: 'Every supported endpoint moved off Windows 10.' },
  { id: 'd365', label: 'Dynamics 365 F&O', tile: 'Dyna­mics 365 F&O', caption: 'Counting, receiving and procure-to-pay at the Cincinnati plant.' },
  { id: 'waltonhills', label: 'Walton Hills COE', caption: 'Plant-wide Wi-Fi, mobile workstations and FeneVision optimization.' },
  { id: 'printers', label: 'Printer Consolidation', tile: 'Printer Consoli­dation', caption: 'One vendor, one contract and a right-sized fleet across every location.' },
  { id: 'itam', label: 'IT Asset Inventory', caption: 'A full reconciliation of every IT asset in the enterprise.' },
  { id: 'infor', label: 'Infor Multi-Site', caption: 'Multi-site manufacturing on Infor.' },
  { id: 'compass', label: 'Technology Compass', tile: 'Tech­nology Compass', caption: 'Portfolio value in one place, live in 2027.' },
  { id: 'copilot', label: 'Copilot', caption: 'Every GDI employee on at least the free version of Copilot in 2027.' },
  // The GDI family
  { id: 'leafguard', label: 'Leafguard', tile: 'Leaf­guard', caption: 'Part of the GDI family of brands.' },
  { id: 'champion', label: 'Champion', caption: 'Part of the GDI family of brands.' },
  { id: 'englert', label: 'Englert', caption: 'Part of the GDI family of brands.' },
  { id: 'stanek', label: 'Stanek Windows', caption: 'Part of the GDI family of brands.' },
  { id: 'patio', label: 'Patio Enclosures', tile: 'Patio Enclo­sures', caption: 'Part of the GDI family of brands.' },
  { id: 'uwd', label: 'Universal Windows Direct', tile: 'Universal Windows Direct', caption: 'Part of the GDI family of brands.' },
];

for (const s of SQUARES) s.tile = s.tile || s.label;
if (SQUARES.length !== 36) throw new Error('ETI Bingo expects 36 squares, found ' + SQUARES.length);
if (new Set(SQUARES.map((s) => s.id)).size !== SQUARES.length) throw new Error('Duplicate square id');

// Pure game rules: cards, patterns, standings. No I/O.

const CENTER = 12;

const LINES = (() => {
  const L = [];
  for (let r = 0; r < 5; r++) L.push([0, 1, 2, 3, 4].map((c) => r * 5 + c));
  for (let c = 0; c < 5; c++) L.push([0, 1, 2, 3, 4].map((r) => r * 5 + c));
  L.push([0, 6, 12, 18, 24]);
  L.push([4, 8, 12, 16, 20]);
  return L;
})();

// Round goals. Simulated with 70 players and a 36-square pool: first line ~draw 9,
// two lines ~draw 16, first full card ~draw 32.
const GOALS = {
  1: { key: 'line', label: 'Any line', short: 'Line' },
  2: { key: 'twoLines', label: 'Two lines', short: 'Two lines' },
  3: { key: 'blackout', label: 'Full card', short: 'Full card' },
};

function hashStr(s) {
  let h = 1779033703 ^ s.length;
  for (let i = 0; i < s.length; i++) {
    h = Math.imul(h ^ s.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return h >>> 0;
}

function rng(seed) {
  let a = typeof seed === 'number' ? seed >>> 0 : hashStr(String(seed));
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function shuffle(arr, rand = Math.random) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// 25 cells: 24 of the pool's square indexes in a seeded order, -1 for the free center.
function makeCells(seed, poolSize) {
  const order = shuffle([...Array(poolSize).keys()], rng(seed)).slice(0, 24);
  order.splice(CENTER, 0, -1);
  return order;
}

function cardKey(cells) {
  return cells.join(',');
}

const unmarkedIn = (line, set) => line.reduce((n, i) => n + (set.has(i) ? 0 : 1), 0);

// Squares still needed to satisfy the goal.
function toGo(goalKey, marks) {
  const set = marks instanceof Set ? marks : new Set(marks);
  set.add(CENTER);
  if (goalKey === 'blackout') return 25 - set.size;
  if (goalKey === 'line') return Math.min(...LINES.map((l) => unmarkedIn(l, set)));
  // two lines: best pair of lines, counting shared cells once
  let best = 99;
  for (let i = 0; i < LINES.length; i++) {
    for (let j = i + 1; j < LINES.length; j++) {
      const u = new Set([...LINES[i], ...LINES[j]]);
      let n = 0;
      for (const c of u) if (!set.has(c)) n++;
      if (n < best) best = n;
    }
  }
  return best;
}

function completedLines(marks) {
  const set = new Set(marks); set.add(CENTER);
  return LINES.filter((l) => l.every((i) => set.has(i)));
}

// Sort summaries for the leaderboard. Each summary: { id, n, t, m:[cells], c, ms, w }
function standings(sums, goalKey) {
  const rows = sums.map((s) => {
    const marks = new Set(s.m || []); marks.add(CENTER);
    return { id: s.id, name: s.n, table: s.t, marks: marks.size - 1, toGo: toGo(goalKey, marks), won: s.w || 0 };
  });
  // Past winners can't win again, so they sit below everyone still in the hunt.
  rows.sort((a, b) => (a.won ? 1 : 0) - (b.won ? 1 : 0) || a.toGo - b.toGo || b.marks - a.marks || a.name.localeCompare(b.name));
  rows.forEach((r, i) => (r.rank = i + 1));
  return rows;
}

// ETI Bingo API: one Vercel function, operations selected with ?op=
// Public:  state (GET, CDN-cached ~1s), join, me, mark, claim, free
// Host:    host-* operations, require the x-host-key header to match HOST_KEY.
//
// Classic bingo: the host draws a square, players tap it on their card if they have it,
// and the first player to press BINGO with the round's pattern complete wins.






const P = process.env.BINGO_PREFIX || 'etibingo:q4-2026';
const K = { game: P + ':game', players: P + ':players', sums: P + ':sums', win: (r) => P + ':win:' + r };
const FAST = process.env.BINGO_FAST === '1' && backend === 'memory'; // load-test mode, local only
const SPIN_MS = FAST ? 100 : 3500; // host spin animation before the square is revealed
const HOST_KEY = process.env.HOST_KEY || (backend === 'memory' ? 'eti-host' : null);

const newGame = () => ({ v: 1, status: 'lobby', round: 1, tables: 10, draws: [], freebies: [], created: Date.now() });

class HttpError extends Error { constructor(code, msg) { super(msg); this.code = code; } }
const bad = (msg, code = 400) => { throw new HttpError(code, msg); };
const id = (n) => crypto.randomBytes(n).toString('base64url');
const parse = (s) => (s ? JSON.parse(s) : null);

async function loadGame() {
  const [g] = await exec([['GET', K.game]]);
  return parse(g) || newGame();
}
async function saveGame(game) {
  game.v = (game.v || 0) + 1;
  await exec([['SET', K.game, JSON.stringify(game)]]);
}
const summary = (p) => ({ id: p.id, n: p.n, t: p.t, k: p.cells, m: p.m, w: p.w, lm: p.lm || 0 });
async function savePlayer(p) {
  await exec([['HSET', K.players, p.id, JSON.stringify(p)], ['HSET', K.sums, p.id, JSON.stringify(summary(p))]]);
}
async function authPlayer(body) {
  const [raw] = await exec([['HGET', K.players, String(body.pid || '')]]);
  const p = parse(raw);
  if (!p || p.tok !== body.token) bad('Card not found. Rejoin from the QR code.', 401);
  return p;
}
const publicPlayer = (p) => ({ id: p.id, name: p.n, table: p.t, cells: p.cells, marks: p.m, free: p.free, won: p.w });

// Squares that have been revealed (the newest draw is hidden while the host screen spins).
const calledSet = (game, now) => new Set(game.draws.filter((d) => now >= d.at).map((d) => d.sq));

// ------------------------------------------------------------ public state
async function state() {
  const now = Date.now();
  const [g, sumsFlat, w1, w2, w3] = await exec([['GET', K.game], ['HGETALL', K.sums], ['GET', K.win(1)], ['GET', K.win(2)], ['GET', K.win(3)]]);
  const game = parse(g) || newGame();
  const sums = Object.values(hashToObj(sumsFlat)).map(parse);
  const goal = GOALS[game.round] || GOALS[1];
  const rows = standings(sums, goal.key);
  const byId = Object.fromEntries(sums.map((s) => [s.id, s]));

  const last = game.draws[game.draws.length - 1] || null;
  let current = null;
  if (last) {
    const live = now >= last.at;
    current = {
      id: last.id, n: last.n, at: last.at, sq: live ? last.sq : null,
      label: live ? SQUARES[last.sq].label : null, caption: live ? SQUARES[last.sq].caption : null,
      onCards: live ? sums.filter((s) => (s.k || []).includes(last.sq)).length : null,
    };
  }
  const wins = {};
  [w1, w2, w3].forEach((raw, i) => {
    const w = parse(raw);
    if (!w) return;
    const s = byId[w.id];
    wins[i + 1] = { id: w.id, name: s ? s.n : 'Player', table: s ? s.t : null, at: w.at };
  });
  const called = game.draws.filter((d) => now >= d.at).map((d) => d.sq);
  return {
    now, v: game.v, status: game.status, round: game.round, goal: goal.key, goalLabel: goal.label,
    tables: game.tables, drawCount: called.length, called, left: SQUARES.length - called.length,
    current, freebies: game.freebies, wins, players: sums.length,
    top: rows.slice(0, 10).map((r) => ({ id: r.id, name: r.name, table: r.table, toGo: r.toGo, marks: r.marks, won: r.won })),
    st: Object.fromEntries(rows.map((r) => [r.id, [r.rank, r.toGo, r.marks]])),
    labels: SQUARES.map((s) => s.label),
    tiles: SQUARES.map((s) => s.tile),
  };
}

// ------------------------------------------------------------ player ops
async function join(body) {
  const game = await loadGame();
  const name = String(body.name || '').replace(/[\u0000-\u001f<>]/g, '').replace(/\s+/g, ' ').trim().slice(0, 32);
  const table = parseInt(body.table, 10);
  if (name.length < 2) bad('Please enter your name.');
  if (!(table >= 1 && table <= game.tables)) bad('Pick your table number.');
  const pid = id(8);
  const p = { id: pid, tok: id(18), n: name, t: table, cells: makeCells(pid + ':' + P, SQUARES.length), m: [], free: {}, w: 0, at: Date.now() };
  await savePlayer(p);
  return { pid, token: p.tok, player: publicPlayer(p), now: Date.now() };
}

async function me(body) {
  const p = await authPlayer(body);
  return { player: publicPlayer(p), now: Date.now() };
}

// Mark one cell. Only squares that have been called can be marked.
async function mark(body) {
  const now = Date.now();
  const [g, raw] = await exec([['GET', K.game], ['HGET', K.players, String(body.pid || '')]]);
  const game = parse(g) || newGame();
  const p = parse(raw);
  if (!p || p.tok !== body.token) bad('Card not found. Rejoin from the QR code.', 401);
  const cell = parseInt(body.cell, 10);
  if (!(cell >= 0 && cell < 25) || cell === CENTER) bad('Pick a square.');
  if (!calledSet(game, now).has(p.cells[cell])) bad("That square hasn't been called yet.", 409);
  if (!p.m.includes(cell)) { p.m.push(cell); p.lm = now; await savePlayer(p); }
  return { player: publicPlayer(p) };
}

// Press BINGO. Wins the current round if the pattern is complete and nobody beat you to it.
async function claim(body) {
  const now = Date.now();
  const game = await loadGame();
  const p = await authPlayer(body);
  const goal = GOALS[game.round];
  if (p.w) bad(`You already won Round ${p.w}. Let someone else have a turn!`, 409);
  if (toGo(goal.key, p.m) > 0) bad(`Not yet! You need ${goal.label.toLowerCase()} for Round ${game.round}.`, 409);
  const [ok] = await exec([['SET', K.win(game.round), JSON.stringify({ id: p.id, at: now }), 'NX']]);
  if (ok !== 'OK') bad('So close! Someone called BINGO first this round.', 409);
  p.w = game.round;
  await savePlayer(p);
  return { won: game.round, player: publicPlayer(p) };
}

async function free(body) {
  const game = await loadGame();
  const p = await authPlayer(body);
  const f = game.freebies.find((x) => x.id === body.freeId);
  if (!f || !f.tables.includes(p.t)) bad('No free square for your table.', 409);
  if (p.free[f.id] != null) bad('You already used this free square.', 409);
  const cell = parseInt(body.cell, 10);
  if (!(cell >= 0 && cell < 25) || cell === CENTER || p.m.includes(cell)) bad('Pick an open square.');
  p.m.push(cell);
  p.free[f.id] = cell;
  p.lm = Date.now();
  await savePlayer(p);
  return { player: publicPlayer(p) };
}

// ------------------------------------------------------------ host ops
async function loadAll() {
  const [g, sumsFlat] = await exec([['GET', K.game], ['HGETALL', K.sums]]);
  return { game: parse(g) || newGame(), sums: Object.values(hashToObj(sumsFlat)).map(parse) };
}

async function hostDraw() {
  const now = Date.now();
  const game = await loadGame();
  const last = game.draws[game.draws.length - 1];
  if (last && now < last.at) bad('Still drawing.', 409);
  const drawn = new Set(game.draws.map((x) => x.sq));
  const fresh = [...SQUARES.keys()].filter((i) => !drawn.has(i));
  if (!fresh.length) bad('Every square has been called.', 409);
  const sq = shuffle(fresh)[0];
  const d = { id: 'd' + (game.draws.length + 1) + '-' + id(3), n: game.draws.length + 1, sq, at: now + SPIN_MS };
  game.draws.push(d);
  game.status = 'live';
  await saveGame(game);
  return { draw: { id: d.id, n: d.n, at: d.at } };
}

async function hostUndo() {
  const game = await loadGame();
  const d = game.draws.pop();
  if (!d) bad('Nothing to undo.');
  await saveGame(game);
  return { undone: SQUARES[d.sq].label, note: 'Players who already marked it keep the mark.' };
}

async function crown(game, sums, round) {
  const [existing] = await exec([['GET', K.win(round)]]);
  if (existing) return null;
  const rows = standings(sums.filter((s) => !s.w), GOALS[round].key);
  const best = rows[0];
  if (!best) return null;
  const [raw] = await exec([['HGET', K.players, best.id]]);
  const p = parse(raw);
  const [ok] = await exec([['SET', K.win(round), JSON.stringify({ id: p.id, at: Date.now(), crowned: true }), 'NX']]);
  if (ok !== 'OK') return null;
  p.w = round;
  await savePlayer(p);
  return { id: p.id, name: p.n, table: p.t };
}

async function hostRound(body) {
  const round = parseInt(body.round, 10);
  if (!GOALS[round]) bad('Round must be 1, 2 or 3.');
  const game = await loadGame();
  game.round = round;
  await saveGame(game);
  return { round };
}

async function hostCrown() {
  const { game, sums } = await loadAll();
  const w = await crown(game, sums, game.round);
  if (!w) bad('This round already has a winner, or nobody is eligible.', 409);
  return { winner: w };
}

async function hostClearWin(body) {
  const round = parseInt(body.round, 10);
  const [raw] = await exec([['GET', K.win(round)]]);
  const w = parse(raw);
  if (!w) bad('No winner recorded for that round.');
  const [praw] = await exec([['HGET', K.players, w.id]]);
  const p = parse(praw);
  await exec([['DEL', K.win(round)]]);
  if (p) { p.w = 0; await savePlayer(p); }
  return { cleared: round };
}

async function hostFree(body) {
  const game = await loadGame();
  const tables = [...new Set((body.tables || []).map((t) => parseInt(t, 10)).filter((t) => t >= 1 && t <= game.tables))];
  if (!tables.length) bad('Pick at least one table.');
  const f = { id: 'f' + (game.freebies.length + 1), tables, at: Date.now(), label: String(body.label || '').slice(0, 40) };
  game.freebies.push(f);
  await saveGame(game);
  return { freebie: f };
}

async function hostSettings(body) {
  const game = await loadGame();
  if (body.tables != null) game.tables = Math.max(1, Math.min(30, parseInt(body.tables, 10) || 10));
  if (body.status && ['lobby', 'live', 'ended'].includes(body.status)) game.status = body.status;
  await saveGame(game);
  return { tables: game.tables, status: game.status };
}

async function hostKick(body) {
  await exec([['HDEL', K.players, String(body.pid)], ['HDEL', K.sums, String(body.pid)]]);
  return { removed: body.pid };
}

async function hostReset(body) {
  if (body.confirm !== 'RESET') bad('Type RESET to confirm.');
  const keep = await loadGame();
  await exec([['DEL', K.game, K.players, K.sums, K.win(1), K.win(2), K.win(3)]]);
  const g = newGame();
  g.tables = keep.tables; g.v = (keep.v || 0) + 1;
  await exec([['SET', K.game, JSON.stringify(g)]]);
  return { reset: true };
}

async function hostPlayers() {
  const { game, sums } = await loadAll();
  return { players: standings(sums, GOALS[game.round].key) };
}

async function handler(req, res) {
  const op = String((req.query && req.query.op) || '');
  try {
    if (op === 'state') {
      res.setHeader('Cache-Control', 'no-store');
      res.setHeader('CDN-Cache-Control', 'max-age=1');
      res.setHeader('Vercel-CDN-Cache-Control', 'max-age=1');
      return res.status(200).json(await state());
    }
    res.setHeader('Cache-Control', 'no-store');
    if (req.method !== 'POST') bad('Use POST.', 405);
    const body = typeof req.body === 'string' ? JSON.parse(req.body || '{}') : req.body || {};
    if (HOST[op]) {
      if (!HOST_KEY) bad('HOST_KEY is not configured on the server.', 500);
      if (req.headers['x-host-key'] !== HOST_KEY) bad('Wrong host key.', 401);
      return res.status(200).json(await HOST[op](body));
    }
    if (PLAYER[op]) return res.status(200).json(await PLAYER[op](body));
    bad('Unknown operation.', 404);
  } catch (e) {
    const code = e instanceof HttpError ? e.code : 500;
    if (code === 500) console.error(e);
    res.status(code).json({ error: e.message || 'Server error' });
  }
}

};

d var(--line); }\n  .panel a { color: var(--navy); font-weight: 700; }\n  .tablegrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }\n<\/style>\n<\/head>\n<body>\n<div class=\"screen\">\n  <header class=\"top\">\n    <div class=\"mark\" id=\"logo\"><\/div>\n    <div><h1>ETI <span>Bingo<\/span><\/h1><div class=\"sub\">Q4 Townhall &middot; Enterprise Technology &amp; Intelligence<\/div><\/div>\n    <div class=\"pills\" id=\"pills\"><\/div>\n  <\/header>\n  <div class=\"sunrule\"><\/div>\n  <div class=\"body\">\n    <main class=\"stage\" id=\"stage\"><\/main>\n    <aside class=\"rail\">\n      <div><h3><span>Called<\/span><span id=\"calledN\"><\/span><\/h3><div class=\"called\" id=\"called\"><\/div><\/div>\n      <div style=\"min-height:0;overflow:hidden\"><h3><span>Leaders<\/span><span id=\"goalS\"><\/span><\/h3><ol class=\"lb\" id=\"lb\"><\/ol><\/div>\n    <\/aside>\n  <\/div>\n<\/div>\n<div class=\"winner\" id=\"winner\"><\/div>\n<div class=\"dock\" id=\"dock\"><\/div>\n<div class=\"msg\" id=\"msg\"><\/div>\n<div class=\"modal\" id=\"modal\"><div class=\"panel\" id=\"panel\"><\/div><\/div>\n<script type=\"module\">\nconst localStorage = (() => { const m = new Map(Object.entries({\"etibingo:hostkey\":\"eti-host\"})); return { getItem: (k) => (m.has(k) ? m.get(k) : null), setItem: (k, v) => m.set(k, String(v)), removeItem: (k) => m.delete(k) }; })();\n// Shared helpers for the player card, host screen and print pages.\nconst API = '/api/game';\n\n\nlet __seq = 0; const __wait = new Map();\naddEventListener('message', (e) => { const d = e.data; if (d && d.__bingo === 'reply' && __wait.has(d.id)) { __wait.get(d.id)(d); __wait.delete(d.id); } });\nasync function api(op, body, hostKey) {\n  const id = ++__seq;\n  const r = await new Promise((res) => { __wait.set(id, res); parent.postMessage({ __bingo: 'call', id, op, body, hostKey }, '*'); });\n  if (r.status >= 400) { const e = new Error((r.json && r.json.error) || 'Request failed (' + r.status + ')'); e.status = r.status; throw e; }\n  return r.json;\n}\n\n// Server clock offset; uncached responses (join/me) are trusted over cached state.\nlet offset = 0, offsetQuality = 99;\nfunction syncClock(serverNow, quality) {\n  if (typeof serverNow !== 'number') return;\n  if (quality <= offsetQuality) { offset = serverNow - Date.now(); offsetQuality = quality; }\n}\nconst now = () => Date.now() + offset;\n\nconst LOGO = `<svg viewBox=\"0 0 100 100\" aria-hidden=\"true\"><g fill=\"#F5A100\"><polygon points=\"45.5,12 54.5,12 54.5,35 50,31 45.5,35\"/><rect x=\"45.5\" y=\"12\" width=\"9\" height=\"21\" transform=\"rotate(-45 50 55)\"/><rect x=\"45.5\" y=\"12\" width=\"9\" height=\"21\" transform=\"rotate(45 50 55)\"/><rect x=\"45.5\" y=\"12\" width=\"9\" height=\"21\" transform=\"rotate(-90 50 55)\"/><rect x=\"45.5\" y=\"12\" width=\"9\" height=\"21\" transform=\"rotate(90 50 55)\"/><\/g><path d=\"M24 91 V64 L50 35 L76 64 V91 H67 V68 L50 49 L33 68 V82 H46 V71 H60 V91 Z\" fill=\"#0B3D91\"/><\/svg>`;\n\nconst esc = (s) => String(s ?? '').replace(/[&<>\"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]));\nconst $ = (sel, el = document) => el.querySelector(sel);\n\n// QR code as an SVG string (needs qrcode-generator on window).\nfunction qrSvg(text, { dark = '#0B3D91', light = '#ffffff', margin = 2 } = {}) {\n  const qr = window.qrcode(0, 'M');\n  qr.addData(text);\n  qr.make();\n  const n = qr.getModuleCount(), size = n + margin * 2;\n  let d = '';\n  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += `M${c + margin} ${r + margin}h1v1h-1z`;\n  return `<svg viewBox=\"0 0 ${size} ${size}\" shape-rendering=\"crispEdges\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"${size}\" height=\"${size}\" fill=\"${light}\"/><path d=\"${d}\" fill=\"${dark}\"/><\/svg>`;\n}\n\nfunction confetti(container, count = 120) {\n  const colors = ['#FFA000', '#F5A100', '#00358A', '#ffffff', '#4F8BE8'];\n  const frag = document.createDocumentFragment();\n  for (let i = 0; i < count; i++) {\n    const p = document.createElement('i');\n    p.className = 'confetti';\n    p.style.left = Math.random() * 100 + '%';\n    p.style.background = colors[i % colors.length];\n    p.style.animationDelay = Math.random() * 0.8 + 's';\n    p.style.animationDuration = 2.4 + Math.random() * 1.8 + 's';\n    p.style.setProperty('--drift', (Math.random() * 2 - 1) * 120 + 'px');\n    p.style.setProperty('--spin', (Math.random() * 2 - 1) * 900 + 'deg');\n    frag.appendChild(p);\n  }\n  container.appendChild(frag);\n  setTimeout(() => container.querySelectorAll('.confetti').forEach((x) => x.remove()), 5200);\n}\n\n\n\nconst params = new URLSearchParams(location.search);\nconst stageOnly = params.get('stage') === '1';\nlet hostKey = localStorage.getItem('etibingo:hostkey') || '';\nlet S = null, view = 'auto', stageKey = '', muted = localStorage.getItem('etibingo:mute') === '1';\nlet seenWins = null, winnerUp = false, auto = false, autoSecs = 15, autoBusy = false;\nconst playUrl = 'POC: join on the phone panel';\n\n$('#logo').innerHTML = LOGO;\n\n// ---------------------------------------------------------------- sound (Web Audio, no files)\nlet ac = null;\nfunction tone(freq, dur = 0.12, type = 'sine', gain = 0.12, when = 0) {\n  if (muted) return;\n  try {\n    ac = ac || new AudioContext();\n    const t = ac.currentTime + when;\n    const o = ac.createOscillator(), g = ac.createGain();\n    o.type = type; o.frequency.value = freq;\n    g.gain.setValueAtTime(0.0001, t);\n    g.gain.exponentialRampToValueAtTime(gain, t + 0.01);\n    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);\n    o.connect(g).connect(ac.destination);\n    o.start(t); o.stop(t + dur + 0.02);\n  } catch { /* audio blocked */ }\n}\nconst sfx = {\n  tick: () => tone(1400, 0.03, 'square', 0.04),\n  land: () => { tone(523, 0.18, 'triangle', 0.18); tone(784, 0.3, 'triangle', 0.18, 0.12); },\n  bingo: () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, 0.22, 'triangle', 0.2, i * 0.13)),\n};\n\n// ---------------------------------------------------------------- helpers\nfunction flash(text, ms = 3200) {\n  const m = $('#msg');\n  m.textContent = text; m.classList.add('show');\n  clearTimeout(flash.h); flash.h = setTimeout(() => m.classList.remove('show'), ms);\n}\nasync function host(op, body = {}) {\n  try {\n    const r = await api(op, body, hostKey);\n    poll();\n    return r;\n  } catch (e) {\n    if (e.status === 401) { askKey(e.message); }\n    else flash(e.message);\n    throw e;\n  }\n}\nfunction modal(html, wire) {\n  $('#panel').innerHTML = html;\n  $('#modal').classList.add('show');\n  wire && wire($('#panel'));\n}\nfunction closeModal() { $('#modal').classList.remove('show'); }\n$('#modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });\n\nfunction askKey(err = '') {\n  modal(`<h2>Host sign-in<\/h2><p>Enter the host key to run the game from this screen.<\/p>\n    <input id=\"hk\" type=\"password\" placeholder=\"Host key\" value=\"\">\n    <p style=\"color:var(--bad);margin-top:8px\">${esc(err)}<\/p>\n    <div class=\"row\"><button class=\"primary\" id=\"hkGo\">Continue<\/button><\/div>`, (p) => {\n    const go = async () => {\n      hostKey = $('#hk', p).value.trim();\n      try { await api('host-check', {}, hostKey); localStorage.setItem('etibingo:hostkey', hostKey); closeModal(); renderDock(); }\n      catch (e) { askKey(e.message); }\n    };\n    $('#hkGo', p).addEventListener('click', go);\n    $('#hk', p).addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });\n    $('#hk', p).focus();\n  });\n}\n\n// ---------------------------------------------------------------- stage\nfunction phase() {\n  const d = S && S.current;\n  if (view === 'lobby' || !d) return 'lobby';\n  if (view === 'board') return 'board';\n  if (now() < d.at || !d.label) return 'spin';\n  return 'called';\n}\n\nfunction recentCalls(n) {\n  return S.called.slice(-n - 1, -1).reverse().map((sq) => S.labels[sq]);\n}\n\nfunction renderStage() {\n  const p = phase();\n  const d = S.current;\n  const key = [p, d ? d.id : '', p === 'lobby' ? S.players : '', p === 'board' ? JSON.stringify(S.top) : '', p === 'called' ? d.onCards + '/' + S.players : ''].join('|');\n  if (key === stageKey) return tickStage(p);\n  const prev = stageKey.split('|');\n  stageKey = key;\n  const st = $('#stage');\n  if (p === 'lobby') {\n    st.innerHTML = `<div class=\"lobby\">\n      <div class=\"qr\">${window.qrcode ? qrSvg(playUrl) : ''}<\/div>\n      <div><div class=\"eyebrow\">Scan to get your card<\/div>\n        <h2>Your card.<br><span>Your squares.<\/span><\/h2>\n        <div class=\"url\">${esc(playUrl.replace(/^https?:\\/\\//, '').replace(/\\/$/, ''))}<\/div>\n        <div class=\"count\">${S.players} <small>PLAYERS IN<\/small><\/div>\n        <div class=\"names\" id=\"names\"><\/div><\/div><\/div>`;\n    loadNames();\n  } else if (p === 'board') {\n    st.innerHTML = `<div class=\"board\"><div class=\"eyebrow\">Round ${S.round} &middot; ${esc(S.goalLabel)}<\/div><h2>Leaderboard<\/h2>\n      <ol>${S.top.map((r, i) => `<li><span class=\"r\">${i + 1}<\/span><span class=\"n\">${esc(r.name)}<small>Table ${r.table}<\/small><\/span>\n        <span class=\"togo\">${r.won ? 'Won R' + r.won : r.toGo === 0 ? 'BINGO' : r.toGo + ' to go'}<\/span><\/li>`).join('')}<\/ol><\/div>`;\n  } else if (p === 'spin') {\n    st.innerHTML = `<div class=\"spin\"><div class=\"eyebrow\">Draw ${d.n}<\/div><div class=\"reel\" id=\"reel\">&nbsp;<\/div><\/div>`;\n  } else {\n    const fresh = prev[0] === 'spin' && prev[1] === d.id;\n    if (fresh) sfx.land();\n    const recent = recentCalls(5);\n    st.innerHTML = `<div class=\"callview\">\n      <div class=\"eyebrow\">Draw ${d.n} &middot; Just called<\/div>\n      <div class=\"bigcall ${fresh ? 'land' : ''}\">${esc(d.label)}<\/div>\n      <div class=\"caption\">${esc(d.caption || '')}<\/div>\n      <div class=\"oncards\"><b>${d.onCards}<\/b> of ${S.players} cards have it. Tap it to mark it!<\/div>\n      ${recent.length ? `<div class=\"recent\"><span>Earlier<\/span>${recent.map((l) => `<i>${esc(l)}<\/i>`).join('')}<\/div>` : ''}\n    <\/div>`;\n  }\n  tickStage(p);\n}\n\nlet reelI = 0, reelSlow = 0;\nfunction tickStage(p) {\n  const d = S.current;\n  if (p !== 'spin') return;\n  const left = d.at - now();\n  const r = $('#reel');\n  reelSlow++;\n  const every = left > 2000 ? 1 : left > 1000 ? 2 : 4;\n  if (r && reelSlow % every === 0) {\n    reelI = (reelI + 1) % S.labels.length;\n    r.textContent = S.labels[reelI];\n    sfx.tick();\n  }\n}\n\nasync function loadNames() {\n  if (!hostKey) return;\n  try {\n    const r = await api('host-players', {}, hostKey);\n    const el = $('#names');\n    if (el) el.innerHTML = r.players.slice().sort((a, b) => a.name.localeCompare(b.name)).map((p) => `<span>${esc(p.name)}<\/span>`).join('');\n  } catch { /* ignore */ }\n}\n\nfunction renderChrome() {\n  $('#pills').innerHTML = `\n    <span class=\"pill amber\">Round ${S.round} &middot; ${esc(S.goalLabel)}<\/span>\n    <span class=\"pill\">${S.players} players<\/span>\n    <span class=\"pill\">${S.drawCount} drawn<\/span>`;\n  const now_ = S.current ? S.current.sq : null;\n  const called = new Set(S.called);\n  $('#called').innerHTML = S.tiles.map((l, i) => `<div class=\"${i === now_ ? 'now' : called.has(i) ? 'on' : ''}\">${esc(l)}<\/div>`).join('');\n  $('#calledN').textContent = `${S.called.length}/${S.labels.length}`;\n  $('#goalS').textContent = S.goalLabel;\n  $('#lb').innerHTML = S.top.slice(0, 6).map((r, i) => `<li><span class=\"r\">${i + 1}<\/span><span class=\"n\">${esc(r.name)}<small>T${r.table}<\/small><\/span><span class=\"g ${r.toGo === 1 && !r.won ? 'one' : ''}\">${r.won ? 'Won R' + r.won : r.toGo === 0 ? 'BINGO' : r.toGo + ' to go'}<\/span><\/li>`).join('')\n    || '<li style=\"grid-template-columns:1fr;color:#9fb2d4\">Waiting for players<\/li>';\n}\n\nfunction checkWins() {\n  const wins = S.wins || {};\n  if (seenWins === null) { seenWins = new Set(Object.entries(wins).map(([r, w]) => `${r}:${w.id}`)); return; }\n  for (const [r, w] of Object.entries(wins)) {\n    const k = `${r}:${w.id}`;\n    if (seenWins.has(k)) continue;\n    seenWins.add(k);\n    showWinner(r, w);\n  }\n}\nfunction showWinner(r, w) {\n  const el = $('#winner');\n  el.innerHTML = `<div class=\"eyebrow\">Round ${r} &middot; ${esc(({ 1: 'Any line', 2: 'Two lines', 3: 'Full card' })[r])}<\/div>\n    <div class=\"big\">BINGO!<\/div><div class=\"who\">${esc(w.name)}<\/div><div class=\"meta\">Table ${w.table}<\/div>\n    <div class=\"hintx\">Click or press Enter to continue<\/div>`;\n  el.classList.add('show'); winnerUp = true;\n  if (auto) { auto = false; flash('Auto-draw paused for the winner'); }\n  confetti(document.body, 180);\n  sfx.bingo();\n}\n$('#winner').addEventListener('click', () => { $('#winner').classList.remove('show'); winnerUp = false; });\n\n// ---------------------------------------------------------------- dock\nfunction renderDock() {\n  const dock = $('#dock');\n  if (stageOnly) { dock.classList.add('hide'); return; }\n  document.body.classList.toggle('docked', !dock.classList.contains('hide'));\n  const spinning = S && S.current && now() < S.current.at;\n  dock.innerHTML = `\n    <button class=\"primary\" data-a=\"draw\" ${spinning ? 'disabled' : ''}>Draw<kbd>D<\/kbd><\/button>\n    <button data-a=\"autoToggle\" class=\"${auto ? 'on' : ''}\">Auto-draw ${auto ? 'on' : 'off'}<kbd>A<\/kbd><\/button>\n    <select id=\"autoSel\" title=\"Auto-draw pace\">${[10, 15, 20, 30].map((s) => `<option value=\"${s}\" ${autoSecs === s ? 'selected' : ''}>every ${s}s<\/option>`).join('')}<\/select>\n    <button data-a=\"undo\">Undo draw<\/button>\n    <span class=\"sep\"><\/span>\n    <button data-a=\"auto\" class=\"${view === 'auto' ? 'on' : ''}\">Game<kbd>G<\/kbd><\/button>\n    <button data-a=\"board\" class=\"${view === 'board' ? 'on' : ''}\">Leaderboard<kbd>L<\/kbd><\/button>\n    <button data-a=\"lobby\" class=\"${view === 'lobby' ? 'on' : ''}\">Join QR<kbd>Q<\/kbd><\/button>\n    <span class=\"sep\"><\/span>\n    ${[1, 2, 3].map((r) => `<button data-a=\"round\" data-r=\"${r}\" class=\"${S && S.round === r ? 'on' : ''}\">R${r}<\/button>`).join('')}\n    <button data-a=\"crown\">Crown leader<\/button>\n    <button data-a=\"free\">Free square<\/button>\n    <span class=\"sep\"><\/span>\n    <button data-a=\"more\">More<\/button>\n    <button data-a=\"mute\">${muted ? 'Sound off' : 'Sound on'}<\/button>\n    <button data-a=\"hide\" title=\"Hide dock (H)\">Hide<kbd>H<\/kbd><\/button>`;\n  $('#autoSel').addEventListener('change', (e) => { autoSecs = parseInt(e.target.value, 10); flash(`Auto-draw every ${autoSecs} seconds`); });\n}\nlet dockSig = '';\nfunction maybeDock() {\n  const spinning = S && S.current && now() < S.current.at;\n  const sig = `${spinning}:${view}:${S && S.round}:${auto}:${autoSecs}:${muted}`;\n  if (sig !== dockSig) { dockSig = sig; renderDock(); }\n}\n\nconst actions = {\n  draw: () => host('host-draw', {}).then(() => { view = 'auto'; }),\n  autoToggle: () => { auto = !auto; flash(auto ? `Auto-draw on, every ${autoSecs} seconds` : 'Auto-draw off'); },\n  undo: () => modal(`<h2>Undo the last draw?<\/h2><p>Puts <b>${esc((S.current && S.current.label) || 'it')}<\/b> back in the bag. Anyone who already marked it keeps the mark.<\/p>\n    <div class=\"row\"><button class=\"primary\" id=\"ok\">Undo draw<\/button><button id=\"no\">Cancel<\/button><\/div>`, (p) => {\n    $('#no', p).onclick = closeModal;\n    $('#ok', p).onclick = async () => { closeModal(); const r = await host('host-undo'); flash(`${r.undone} is back in the bag`); };\n  }),\n  auto: () => { view = 'auto'; },\n  board: () => { view = view === 'board' ? 'auto' : 'board'; },\n  lobby: () => { view = view === 'lobby' ? 'auto' : 'lobby'; },\n  round: (b) => {\n    const r = parseInt(b.dataset.r, 10);\n    if (S.round === r) return;\n    modal(`<h2>Start Round ${r}?<\/h2><p>The goal becomes <b>${({ 1: 'Any line', 2: 'Two lines', 3: 'Full card' })[r]}<\/b>. Anyone who already has it can press BINGO right away. Previous winners cannot win again.<\/p>\n      <div class=\"row\"><button class=\"primary\" id=\"ok\">Start Round ${r}<\/button><button id=\"no\">Cancel<\/button><\/div>`, (p) => {\n      $('#no', p).onclick = closeModal;\n      $('#ok', p).onclick = async () => { closeModal(); const res = await host('host-round', { round: r }); if (res.autoWinner) flash(`${res.autoWinner.name} already had it!`); };\n    });\n  },\n  crown: () => modal(`<h2>Crown the leader?<\/h2><p>Awards Round ${S.round} to the top eligible player on the leaderboard right now (use it if nobody claims before time runs out). Leader: <b>${esc((S.top.find((r) => !r.won) || {}).name || 'nobody yet')}<\/b>.<\/p>\n    <div class=\"row\"><button class=\"primary\" id=\"ok\">Crown them<\/button><button id=\"no\">Cancel<\/button><\/div>`, (p) => {\n    $('#no', p).onclick = closeModal;\n    $('#ok', p).onclick = async () => { closeModal(); await host('host-crown'); };\n  }),\n  free: () => {\n    const sel = new Set();\n    modal(`<h2>Award a free square<\/h2><p>Everyone at the selected tables can mark any open square on their card.<\/p>\n      <input id=\"fl\" placeholder=\"What for? (e.g. Jeopardy winners)\" maxlength=\"40\">\n      <div class=\"tablegrid\" style=\"margin-top:10px\">${Array.from({ length: S.tables }, (_, i) => `<button data-t=\"${i + 1}\">Table ${i + 1}<\/button>`).join('')}<\/div>\n      <div class=\"row\"><button class=\"primary\" id=\"ok\">Award<\/button><button id=\"no\">Cancel<\/button><\/div>`, (p) => {\n      p.querySelectorAll('[data-t]').forEach((b) => (b.onclick = () => { const t = +b.dataset.t; sel.has(t) ? sel.delete(t) : sel.add(t); b.classList.toggle('sel'); }));\n      $('#no', p).onclick = closeModal;\n      $('#ok', p).onclick = async () => { closeModal(); await host('host-free', { tables: [...sel], label: $('#fl', n: column; align-items: center; justify-content: center; text-align: center; padding: 30px; }\n  .win.show { display: flex; }\n  .win h2 { font-family: var(--display); font-weight: 800; font-size: 84px; line-height: .9; color: var(--amber); }\n  .win p { font-size: 18px; margin-top: 12px; color: #dbe4f3; max-width: 320px; }\n  .win .btn { max-width: 280px; }\n<\/style>\n<\/head>\n<body>\n<div id=\"app\"><\/div>\n<button class=\"bingo\" id=\"bingo\" type=\"button\">BINGO!<small>Tap to claim it<\/small><\/button>\n<div class=\"win\" id=\"win\"><\/div>\n<div class=\"toast\" id=\"toast\" role=\"status\"><\/div>\n<script type=\"module\">\nconst localStorage = (() => { const m = new Map(Object.entries({})); return { getItem: (k) => (m.has(k) ? m.get(k) : null), setItem: (k, v) => m.set(k, String(v)), removeItem: (k) => m.delete(k) }; })();\n// Shared helpers for the player card, host screen and print pages.\nconst API = '/api/game';\n\n\nlet __seq = 0; const __wait = new Map();\naddEventListener('message', (e) => { const d = e.data; if (d && d.__bingo === 'reply' && __wait.has(d.id)) { __wait.get(d.id)(d); __wait.delete(d.id); } });\nasync function api(op, body, hostKey) {\n  const id = ++__seq;\n  const r = await new Promise((res) => { __wait.set(id, res); parent.postMessage({ __bingo: 'call', id, op, body, hostKey }, '*'); });\n  if (r.status >= 400) { const e = new Error((r.json && r.json.error) || 'Request failed (' + r.status + ')'); e.status = r.status; throw e; }\n  return r.json;\n}\n\n// Server clock offset; uncached responses (join/me) are trusted over cached state.\nlet offset = 0, offsetQuality = 99;\nfunction syncClock(serverNow, quality) {\n  if (typeof serverNow !== 'number') return;\n  if (quality <= offsetQuality) { offset = serverNow - Date.now(); offsetQuality = quality; }\n}\nconst now = () => Date.now() + offset;\n\nconst LOGO = `<svg viewBox=\"0 0 100 100\" aria-hidden=\"true\"><g fill=\"#F5A100\"><polygon points=\"45.5,12 54.5,12 54.5,35 50,31 45.5,35\"/><rect x=\"45.5\" y=\"12\" width=\"9\" height=\"21\" transform=\"rotate(-45 50 55)\"/><rect x=\"45.5\" y=\"12\" width=\"9\" height=\"21\" transform=\"rotate(45 50 55)\"/><rect x=\"45.5\" y=\"12\" width=\"9\" height=\"21\" transform=\"rotate(-90 50 55)\"/><rect x=\"45.5\" y=\"12\" width=\"9\" height=\"21\" transform=\"rotate(90 50 55)\"/><\/g><path d=\"M24 91 V64 L50 35 L76 64 V91 H67 V68 L50 49 L33 68 V82 H46 V71 H60 V91 Z\" fill=\"#0B3D91\"/><\/svg>`;\n\nconst esc = (s) => String(s ?? '').replace(/[&<>\"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]));\nconst $ = (sel, el = document) => el.querySelector(sel);\n\n// QR code as an SVG string (needs qrcode-generator on window).\nfunction qrSvg(text, { dark = '#0B3D91', light = '#ffffff', margin = 2 } = {}) {\n  const qr = window.qrcode(0, 'M');\n  qr.addData(text);\n  qr.make();\n  const n = qr.getModuleCount(), size = n + margin * 2;\n  let d = '';\n  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += `M${c + margin} ${r + margin}h1v1h-1z`;\n  return `<svg viewBox=\"0 0 ${size} ${size}\" shape-rendering=\"crispEdges\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"${size}\" height=\"${size}\" fill=\"${light}\"/><path d=\"${d}\" fill=\"${dark}\"/><\/svg>`;\n}\n\nfunction confetti(container, count = 120) {\n  const colors = ['#FFA000', '#F5A100', '#00358A', '#ffffff', '#4F8BE8'];\n  const frag = document.createDocumentFragment();\n  for (let i = 0; i < count; i++) {\n    const p = document.createElement('i');\n    p.className = 'confetti';\n    p.style.left = Math.random() * 100 + '%';\n    p.style.background = colors[i % colors.length];\n    p.style.animationDelay = Math.random() * 0.8 + 's';\n    p.style.animationDuration = 2.4 + Math.random() * 1.8 + 's';\n    p.style.setProperty('--drift', (Math.random() * 2 - 1) * 120 + 'px');\n    p.style.setProperty('--spin', (Math.random() * 2 - 1) * 900 + 'deg');\n    frag.appendChild(p);\n  }\n  container.appendChild(frag);\n  setTimeout(() => container.querySelectorAll('.confetti').forEach((x) => x.remove()), 5200);\n}\n\n\n\nconst LS = 'etibingo:';\nconst load = (k, d) => { try { return JSON.parse(localStorage.getItem(LS + k)) ?? d; } catch { return d; } };\nconst keep = (k, v) => { try { localStorage.setItem(LS + k, JSON.stringify(v)); } catch { /* private mode */ } };\n\nlet cred = load('cred', null);   // { pid, token }\nlet S = null;                    // last public state\nlet me = null;                   // my card\nlet lastV = null;\nlet lastDraw = load('lastDraw', null);\nlet seenWins = load('wins', {});\nlet stampCell = null;\nlet pick = null;                 // selected cell for a free square\nlet pending = new Set();         // cells being marked right now\nconst LETTERS = ['B', 'I', 'N', 'G', 'O'];\nconst app = $('#app');\n\n// --- pattern check (mirrors lib/engine.js) ---\nconst LINES = (() => {\n  const L = [];\n  for (let r = 0; r < 5; r++) L.push([0, 1, 2, 3, 4].map((c) => r * 5 + c));\n  for (let c = 0; c < 5; c++) L.push([0, 1, 2, 3, 4].map((r) => r * 5 + c));\n  L.push([0, 6, 12, 18, 24], [4, 8, 12, 16, 20]);\n  return L;\n})();\nfunction toGo(goal, marks) {\n  const set = new Set(marks); set.add(12);\n  const miss = (cells) => cells.reduce((n, i) => n + (set.has(i) ? 0 : 1), 0);\n  if (goal === 'blackout') return 25 - set.size;\n  if (goal === 'line') return Math.min(...LINES.map(miss));\n  let best = 99;\n  for (let i = 0; i < LINES.length; i++) for (let j = i + 1; j < LINES.length; j++) best = Math.min(best, miss([...new Set([...LINES[i], ...LINES[j]])]));\n  return best;\n}\n\nfunction toast(msg, ms = 3500) {\n  const t = $('#toast');\n  t.innerHTML = msg;\n  t.classList.add('show');\n  clearTimeout(toast.h);\n  toast.h = setTimeout(() => t.classList.remove('show'), ms);\n}\nconst buzz = (p) => { try { navigator.vibrate && navigator.vibrate(p); } catch { /* unsupported */ } };\n\n// ---------------------------------------------------------------- join\nfunction renderJoin(errMsg = '') {\n  const tables = (S && S.tables) || 10;\n  const preset = parseInt(new URLSearchParams(location.search).get('t'), 10);\n  app.innerHTML = `\n    <form class=\"join\" id=\"joinForm\" autocomplete=\"off\">\n      <div class=\"mark\">${LOGO}<\/div>\n      <div class=\"eyebrow\">ETI Q4 Townhall &middot; Nov 18<\/div>\n      <h1>ETI <span>Bingo<\/span><\/h1>\n      <p class=\"sub\">Get your card, tap each square when it's called, and hit BINGO first to win.<\/p>\n      <label for=\"nm\">Your name<\/label>\n      <input id=\"nm\" name=\"name\" maxlength=\"32\" placeholder=\"First and last name\" value=\"${esc(load('name', ''))}\" required>\n      <label for=\"tb\">Your table<\/label>\n      <select id=\"tb\" name=\"table\" required>\n        <option value=\"\">Pick your table<\/option>\n        ${Array.from({ length: tables }, (_, i) => `<option value=\"${i + 1}\" ${preset === i + 1 ? 'selected' : ''}>Table ${i + 1}<\/option>`).join('')}\n      <\/select>\n      <button class=\"btn\" id=\"go\" type=\"submit\">Get my card<\/button>\n      <div class=\"err\" id=\"err\">${esc(errMsg)}<\/div>\n      <p class=\"fine\">One card per person. Keep this page open on your phone.<\/p>\n    <\/form>`;\n  $('#bingo').classList.remove('show');\n  $('#joinForm').addEventListener('submit', async (e) => {\n    e.preventDefault();\n    const btn = $('#go');\n    btn.disabled = true;\n    try {\n      const name = $('#nm').value.trim();\n      const r = await api('join', { name, table: $('#tb').value });\n      syncClock(r.now, 1);\n      cred = { pid: r.pid, token: r.token };\n      keep('cred', cred); keep('name', name);\n      me = r.player;\n      lastDraw = S && S.current ? S.current.id : null; keep('lastDraw', lastDraw);\n      renderMain();\n    } catch (err) {\n      $('#err').textContent = err.message;\n      btn.disabled = false;\n    }\n  });\n}\n\n// ---------------------------------------------------------------- main view\nfunction renderMain() {\n  if (!me || !S) return;\n  app.innerHTML = `\n    <header class=\"top\">\n      <div class=\"mark\">${LOGO}<\/div>\n      <div><h1>ETI <span>Bingo<\/span><\/h1><div class=\"who\">${esc(me.name)} &middot; Table ${me.table}<\/div><\/div>\n      <div class=\"chip\" id=\"chip\"><\/div>\n    <\/header>\n    <div class=\"sunrule\"><\/div>\n    <main class=\"wrap\">\n      <div class=\"called\" id=\"called\"><\/div>\n      <div class=\"status\" id=\"status\"><\/div>\n      <div class=\"card\">\n        <div class=\"letters\">${LETTERS.map((l) => `<div>${l}<\/div>`).join('')}<\/div>\n        <div class=\"grid\" id=\"grid\"><\/div>\n      <\/div>\n      <div id=\"banner\"><\/div>\n      <p class=\"hint\" id=\"hint\"><\/p>\n    <\/main>`;\n  $('#grid').addEventListener('click', onTile);\n  renderAll();\n}\n\nconst calledSet = () => new Set(S.called);\nconst activeFreebie = () => (S && me ? S.freebies.find((f) => f.tables.includes(me.table) && (me.free || {})[f.id] == null) || null : null);\n\nfunction renderCalled() {\n  const el = $('#called');\n  if (!el) return;\n  const d = S.current;\n  if (!d) { el.innerHTML = `<div><small>Waiting for the first draw<\/small><b>Keep this page open<\/b><\/div>`; return; }\n  if (!d.label) { el.innerHTML = `<div><small>Draw ${d.n}<\/small><b>Drawing&hellip;<\/b><\/div>`; return; }\n  const cell = me.cells.indexOf(d.sq);\n  const status = cell < 0 ? `<span class=\"no\">Not on<br>your card<\/span>`\n    : me.marks.includes(cell) ? `<span class=\"yes\">Marked<\/span>` : `<span class=\"yes\">On your card!<br>Tap it<\/span>`;\n  el.innerHTML = `<div><small>Just called &middot; Draw ${d.n}<\/small><b>${esc(d.label)}<\/b><\/div>${status}`;\n}\n\nfunction renderStatus() {\n  if (!$('#status')) return;\n  $('#chip').textContent = `R${S.round} · ${S.goalLabel}`;\n  const st = S.st[me.id];\n  const left = toGo(S.goal, me.marks);\n  const won = me.won ? `<div class=\"stat hot\"><b>Winner<\/b><small>Round ${me.won}<\/small><\/div>` : `<div class=\"stat ${left <= 1 ? 'hot' : ''}\"><b>${left}<\/b><small>to go<\/small><\/div>`;\n  $('#status').innerHTML = `${won}\n    <div class=\"stat\"><b>#${st ? st[0] : '-'}<\/b><small>of ${S.players}<\/small><\/div>\n    <div class=\"stat\"><b>${me.marks.length}<span style=\"font-size:15px;color:var(--muted)\">/24<\/span><\/b><small>marked<\/small><\/div>`;\n  const f = activeFreebie();\n  $('#banner').innerHTML = f ? `<div class=\"banner\"><b>Your table won a free square!<\/b> Tap any open square, then tap it again to mark it.<\/div>` : '';\n  $('#hint').textContent = S.left === 0 ? 'Every square has been called.' : `${S.drawCount} called · ${S.left} still in the bag`;\n\n  const winner = S.wins[S.round];\n  const ready = !me.won && !winner && left === 0;\n  $('#bingo').classList.toggle('show', ready);\n}\n\nfunction renderCard() {\n  const grid = $('#grid');\n  if (!grid) return;\n  const called = calledSet();\n  const marks = new Set(me.marks);\n  const f = activeFreebie();\n  const sig = [...marks].sort().join(',') + '|' + S.called.join(',') + '|' + (f ? f.id : '') + '|' + pick + '|' + stampCell;\n  if (sig === renderCard.sig && grid.childElementCount) return; // don't swap tiles under a finger\n  renderCard.sig = sig;\n  grid.innerHTML = me.cells.map((sq, i) => {\n    if (sq === -1) return `<div class=\"tile free\" aria-label=\"Free square\"><div class=\"mark\">${LOGO}<\/div><\/div>`;\n    const cls = ['tile'];\n    if (marks.has(i)) cls.push('marked');\n    else if (called.has(sq)) cls.push('ready');\n    else if (f) { cls.push('pick'); if (pick === i) cls.push('sel'); }\n    if (stampCell === i) cls.push('stamp');\n    return `<div class=\"${cls.join(' ')}\" data-cell=\"${i}\" role=\"button\">${esc(S.tiles[sq])}<\/div>`;\n  }).join('');\n  stampCell = null;\n}\n\nfunction renderAll() { renderCalled(); renderStatus(); renderCard(); }\n\nasync function onTile(e) {\n  const tile = e.target.closest('.tile');\n  if (!tile || tile.classList.contains('free') || tile.classList.contains('marked')) return;\n  const cell = parseInt(tile.dataset.cell, 10);\n  if (tile.classList.contains('ready')) return markCell(cell);\n  const f = activeFreebie();\n  if (f) {\n    if (pick !== cell) { pick = cell; renderCard(); return; }\n    try {\n      const r = await api('free', { ...cred, freeId: f.id, cell });\n      me = r.player; pick = null; stampCell = cell; buzz(30);\n      toast(`Free square used on <b>${esc(S.labels[me.cells[cell]])}<\/b>.`);\n      renderAll();\n    } catch (err) { toast(esc(err.message)); }\n    return;\n  }\n  toast(`<b>${esc(S.labels[me.cells[cell]])}<\/b> hasn't been called yet.`, 2200);\n}\n\nasync function markCell(cell) {\n  if (pending.has(cell)) return;\n  pending.add(cell);\n  me.marks = [...me.marks, cell]; stampCell = cell; buzz(25);\n  renderAll();\n  try {\n    const r = await api('mark', { ...cred, cell });\n    me = r.player;\n  } catch (err) {\n    me.marks = me.marks.filter((c) => c !== cell);\n    toast(esc(err.message));\n    renderAll();\n  } finally { pending.delete(cell); }\n}\n\n$('#bingo').addEventListener('click', async () => {\n  const b = $('#bingo');\n  b.disabled = true;\n  try {\n    const r = await api('claim', cred);\n    me = r.player;\n    showMyWin(r.won);\n  } catch (err) { toast(esc(err.message), 4500); }\n  finally { b.disabled = false; renderStatus(); }\n});\n\n// ---------------------------------------------------------------- wins\nfunction showMyWin(round) {\n  seenWins[`${round}:${me.id}`] = true; keep('wins', seenWins);\n  const win = $('#win');\n  win.innerHTML = `<div class=\"mark\" style=\"width:72px;height:72px;background:#fff;border-radius:16px;padding:7px;margin-bottom:16px\">${LOGO}<\/div>\n    <h2>BINGO!<\/h2><p>You won <b>Round ${round}<\/b>. Head to the front to claim your prize.<\/p>\n    <button class=\"btn\" id=\"winOk\">Back to my card<\/button>`;\n  win.classList.add('show');\n  confetti(document.body);\n  buzz([80, 60, 80, 60, 200]);\n  $('#winOk').addEventListener('click', () => win.classList.remove('show'));\n}\n\nfunction checkWins() {\n  for (const [r, w] of Object.entries(S.wins || {})) {\n    const k = `${r}:${w.id}`;\n    if (seenWins[k]) continue;\n    seenWins[k] = true; keep('wins', seenWins);\n    if (me && w.id === me.id) showMyWin(r);\n    else toast(`<b>BINGO!<\/b> ${esc(w.name)} (Table ${w.table}) won Round ${r}.`, 6000);\n  }\n}\n\nfunction checkNewDraw() {\n  const d = S.current;\n  if (!d || !d.label || d.id === lastDraw) return;\n  lastDraw = d.id; keep('lastDraw', lastDraw);\n  const el = $('#called');\n  if (el) { el.classList.remove('fresh'); void el.offsetWidth; el.classList.add('fresh'); }\n  if (me.cells.includes(d.sq)) buzz([40, 50, 40]);\n}\n\n// ---------------------------------------------------------------- data loop\nasync function refreshMe() {\n  if (!cred) return;\n  try {\n    const r = await api('me', cred);\n    syncClock(r.now, 1);\n    const local = new Set(me ? me.marks : []);\n    me = r.player;\n    for (const c of pending) if (local.has(c) && !me.marks.includes(c)) me.marks.push(c);\n  } catch (err) {\n    if (err.status === 401) { cred = null; keep('cred', null); me = null; renderJoin('Your card was reset. Please join again.'); }\n  }\n}\n\nlet polling = false;\nasync function poll() {\n  if (polling) return;\n  polling = true;\n  try {\n    const s = await api('state');\n    syncClock(s.now, 5);\n    const first = !S;\n    S = s;\n    if (!cred) { if (first || !$('#joinForm')) renderJoin(); return; }\n    if (!me || s.v !== lastV) { lastV = s.v; await refreshMe(); if (!me) return; }\n    if (!$('#grid')) renderMain();\n    if (first) for (const [r, w] of Object.entries(S.wins || {})) if (w.id !== me.id) seenWins[`${r}:${w.id}`] = true;\n    checkNewDraw(); renderAll(); checkWins();\n  } catch {\n    if (!S) app.innerHTML = `<div class=\"join\"><h1>ETI <span>Bingo<\/span><\/h1><p class=\"sub\">Can't reach the game right now. Retrying&hellip;<\/p><\/div>`;\n  } finally { polling = false; }\n}\n\nsetInterval(poll, 1500);\ndocument.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });\npoll();\n\n<\/script>\n<\/body>\n<\/html>\n";
const $ = (s) => document.querySelector(s);

// Route API calls from the frames to the in-page server.
addEventListener('message', async (e) => {
  const d = e.data;
  if (!d || d.__bingo !== 'call') return;
  const r = await BINGO.call(d.op, d.body, d.hostKey);
  e.source.postMessage({ __bingo: 'reply', id: d.id, status: r.status, json: r.json }, '*');
});

$('#host').srcdoc = HOST_HTML;
function addPhone() {
  const box = document.createElement('div');
  box.className = 'phone';
  box.innerHTML = '<iframe title="Phone"></iframe>';
  box.firstChild.srcdoc = PLAYER_HTML;
  $('#phones').appendChild(box);
  sizePhones();
}
function sizePhones() {
  const n = $('#phones').children.length;
  $('#addPhone').disabled = n >= 3;
  $('#dropPhone').hidden = n < 2;
}
$('#addPhone').onclick = addPhone;
$('#dropPhone').onclick = () => { $('#phones').lastChild.remove(); sizePhones(); };
$('#restart').onclick = () => location.reload();
addPhone();

// ---------------------------------------------------------------- bot players
const FIRST = ['Avery','Blake','Casey','Dana','Eli','Frankie','Gray','Harper','Indy','Jamie','Kai','Logan','Morgan','Noel','Oakley','Parker','Quinn','Reese','Sage','Taylor','Uma','Vic','Wren','Xan','Yael','Zion','Ari','Bailey','Cam','Drew','Emery','Finley','Hayden','Jordan','Kendall'];
const bots = [];
let speed = 1;
const rand = (a, b) => a + Math.random() * (b - a);
const host = (op, body = {}) => BINGO.call(op, body, 'eti-host');

async function setBots(n) {
  while (bots.length > n) { const b = bots.pop(); b.gone = true; await host('host-kick', { pid: b.pid }); }
  while (bots.length < n) {
    const i = bots.length;
    const name = FIRST[i % FIRST.length] + ' ' + String.fromCharCode(65 + ((i * 7) % 26)) + '. (bot)';
    const r = await BINGO.call('join', { name, table: 1 + (i % 10) });
    if (r.status !== 200) break;
    bots.push({ pid: r.json.pid, token: r.json.token, cells: r.json.player.cells, marked: new Set(), pending: new Set(),
      react: rand(3, 12), miss: Math.random() * 0.25, won: 0, claiming: false });
  }
  status();
}
function status() {
  $('#botStatus').textContent = bots.length ? bots.length + ' bot players are in the game' : 'No bots: just you';
}

async function tick() {
  const S = (await BINGO.call('state')).json;
  for (const b of bots) {
    if (b.gone) continue;
    for (const sq of S.called) {
      const cell = b.cells.indexOf(sq);
      if (cell < 0 || b.marked.has(cell) || b.pending.has(cell)) continue;
      b.pending.add(cell);
      const late = Math.random() < b.miss ? rand(15, 45) : 0;
      setTimeout(async () => {
        if (b.gone) return;
        const r = await BINGO.call('mark', { pid: b.pid, token: b.token, cell });
        if (r.status === 200) b.marked.add(cell);
        b.pending.delete(cell);
      }, (b.react * rand(0.5, 1.5) + late) * 1000 * speed);
    }
    const st = S.st[b.pid];
    if (!b.won && !b.claiming && !S.wins[S.round] && st && st[1] === 0) {
      b.claiming = true;
      setTimeout(async () => {
        if (b.gone) return;
        const r = await BINGO.call('claim', { pid: b.pid, token: b.token });
        if (r.status === 200) b.won = r.json.won;
        b.claiming = false;
      }, rand(2, 7) * 1000 * speed);
    }
  }
}
setInterval(tick, 500);
$('#botCount').onchange = (e) => setBots(+e.target.value);
$('#botSpeed').onchange = (e) => { speed = +e.target.value; };
setBots(30);
</script>
